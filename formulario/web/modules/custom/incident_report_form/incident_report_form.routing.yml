incident_report_form.report_incident:
  path: '/form/incident-report-form/report-incident'
  defaults:
    _title: 'Notificar un problema'
    _form: '\Drupal\incident_report_form\Form\IncidentReportForm'
  requirements:
    _permission: 'access content'

incident_report_form.view_submissions:
  path: '/incident-report/my-submissions'
  defaults:
    _title: 'Mis solicitudes'
    _controller: '\Drupal\incident_report_form\Controller\ListSubmissionsController::listSubmissions'
  requirements:
    _permission: 'access content'
